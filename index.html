<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>ЧЕКУШКИ — Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg"></div>
  <main>
    <header class="top">
      <div>
        <div class="logo">ЧЕКУШКИ</div>
        <div class="sub">АРКАДА</div>
      </div>
      <button class="icon-btn" id="closeBtn">×</button>
    </header>

    <section class="profile glass">
      <div class="avatar" id="avatar">?</div>
      <div class="profile-info">
        <b id="name">Игрок</b>
        <span id="username">@player</span>
      </div>
      <div class="score">
        <small>ОЧКИ</small>
        <b id="score">0</b>
      </div>
    </section>

    <section id="home" class="screen active">
      <h2>Мини-игры</h2>
      <div class="games">
        <button class="game-card" data-game="dice"><span>🎲</span><b>Кубик</b><small>Бросок 1–6</small></button>
        <button class="game-card" data-game="coin"><span>🪙</span><b>Монетка</b><small>Орел или решка</small></button>
        <button class="game-card" data-game="plinko"><span>🔵</span><b>Plinko</b><small>Поймай множитель</small></button>
        <button class="game-card" data-game="rocket"><span>🚀</span><b>Rocket</b><small>Набери высоту</small></button>
        <button class="game-card" data-game="cards"><span>🃏</span><b>Карты</b><small>21 очко</small></button>
        <button class="game-card" data-game="slots"><span>🎰</span><b>Слоты</b><small>Три символа</small></button>
      </div>
    </section>

    <section id="game" class="screen">
      <button class="back" id="backBtn">← Назад</button>
      <h2 id="gameTitle">Игра</h2>
      <div class="game-panel glass">
        <div id="gameVisual" class="game-visual"></div>
        <div id="gameText" class="game-text">Готов?</div>
        <button id="playBtn" class="play">ИГРАТЬ</button>
      </div>
    </section>
  </main>

  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
